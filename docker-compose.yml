services:
  fastclinic:
    build: .
    container_name: fastclinic-cockpit
    ports:
      - "5005:5005"
    env_file:
      - .env
    # Stateless: no volume, no database. Everything clinical lives in MedBackend,
    # reached over backbone GraphQL with the signed-in user's own token.
    restart: unless-stopped
