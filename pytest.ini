[pytest]
pythonpath = .
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
addopts = -v --tb=short --strict-markers -ra
timeout = 30
filterwarnings = ignore::DeprecationWarning

markers =
    unit: fast, isolated, no network
    integration: exercises routes through the test client
    e2e: live, requires MEDBACKEND_LIVE_TEST=1 and a reachable dev project
    real_auth_gate: run against the real gate, opting out of the conftest bypass
